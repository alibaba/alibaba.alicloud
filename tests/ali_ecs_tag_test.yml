---
- name: Validate module ali_ecs_tag
  hosts: localhost
  remote_user: root

  roles:
    - vpc
    - vswitch
    - security_group
    - ram
    - instance
    - network_interface

  tasks:
    - name: Filter instance using name_regex
      alibaba.alicloud.ali_instance_info:
        name_prefix: '{{ name }}'
        filters:
          vpc_id: '{{ vpcs.vpcs[0].id }}'
      register: instances

    - name: Changed. Add Tags.
      alibaba.alicloud.ali_ecs_tag:
        resource_type: 'instance'
        resource_ids: '{{ instances.ids }}'
        tags: {
                "Ansible": "Add tags"
        }

    - name: No Changed. Add Tags.
      alibaba.alicloud.ali_ecs_tag:
        resource_type: 'instance'
        resource_ids: '{{ instances.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: Changed. Remove Tags.
      alibaba.alicloud.ali_ecs_tag:
        state: absent
        resource_type: 'instance'
        resource_ids: '{{ instances.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: No Changed. Remove Tags.
      alibaba.alicloud.ali_ecs_tag:
        state: absent
        resource_type: 'instance'
        resource_ids: '{{ instances.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: Filter security group using name_regex
      alibaba.alicloud.ali_security_group_info:
        name_prefix: '{{ name }}'
      register: sgs

    - name: Changed. Add security group Tags.
      alibaba.alicloud.ali_ecs_tag:
        resource_type: 'securitygroup'
        resource_ids: '{{ sgs.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: No Changed. Add security group Tags.
      alibaba.alicloud.ali_ecs_tag:
        resource_type: 'securitygroup'
        resource_ids: '{{ sgs.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: Changed. Remove security group Tags.
      alibaba.alicloud.ali_ecs_tag:
        state: absent
        resource_type: 'securitygroup'
        resource_ids: '{{ sgs.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: No Changed. Remove security group Tags.
      alibaba.alicloud.ali_ecs_tag:
        state: absent
        resource_type: 'securitygroup'
        resource_ids: '{{ sgs.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: Filter eni using name_regex
      alibaba.alicloud.ali_eni_info:
        name_prefix: '{{ name }}'
      register: enis

    - name: Changed. Add eni Tags.
      alibaba.alicloud.ali_ecs_tag:
        resource_type: 'eni'
        resource_ids: '{{ enis.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: No Changed. Add eni Tags.
      alibaba.alicloud.ali_ecs_tag:
        resource_type: 'eni'
        resource_ids: '{{ enis.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: Make sure all resources have been ready
      pause:
        seconds: 30

    - name: Changed. Remove eni Tags.
      alibaba.alicloud.ali_ecs_tag:
        state: absent
        resource_type: 'eni'
        resource_ids: '{{ enis.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: No Changed. Remove eni Tags.
      alibaba.alicloud.ali_ecs_tag:
        state: absent
        resource_type: 'eni'
        resource_ids: '{{ enis.ids }}'
        tags: {
          "Ansible": "Add tags"
        }

    - name: Create a custom image for exact image ID tag testing
      alibaba.alicloud.ali_image:
        instance_id: '{{ instances.ids[0] }}'
        image_name: '{{ name }}-image-tag'
        wait: true
        wait_timeout: 900
      register: tagged_image

    - name: Add a tag to the custom image by its exact ID
      alibaba.alicloud.ali_ecs_tag:
        resource_type: image
        resource_ids:
          - '{{ tagged_image.image_id }}'
        tags:
          Ansible: ImageTag

    - name: Read the tagged custom image
      alibaba.alicloud.ali_image_info:
        image_ids:
          - '{{ tagged_image.image_id }}'
      register: tagged_image_info

    - name: Verify the exact custom image was tagged
      ansible.builtin.assert:
        that:
          - tagged_image_info.total | int == 1
          - tagged_image_info.images[0].tags.Ansible == 'ImageTag'

    - name: Remove the custom image tag by its exact ID
      alibaba.alicloud.ali_ecs_tag:
        state: absent
        resource_type: image
        resource_ids:
          - '{{ tagged_image.image_id }}'
        tags:
          Ansible: ImageTag

    - name: Verify the custom image tag was removed
      alibaba.alicloud.ali_image_info:
        image_ids:
          - '{{ tagged_image.image_id }}'
      register: untagged_image_info

    - name: Assert the custom image tag is absent
      ansible.builtin.assert:
        that:
          - "'Ansible' not in untagged_image_info.images[0].tags"

    - name: Delete the custom image used by the image tag test
      alibaba.alicloud.ali_image:
        image_id: '{{ tagged_image.image_id }}'
        state: absent

    - name: Delete the snapshot generated for the image tag test
      ansible.builtin.command:
        argv:
          - aliyun
          - ecs
          - delete-snapshot
          - --region
          - '{{ lookup(''env'', ''ALICLOUD_REGION'') }}'
          - --snapshot-id
          - '{{ item.snapshot_id }}'
      loop: '{{ tagged_image.image.disk_device_mappings.disk_device_mapping }}'
      no_log: true

    # Delete all of resource
    - name: Changed. Deleting enis
      alibaba.alicloud.ali_eni:
        id: '{{item}}'
        state: absent
      with_items: '{{enis.ids}}'

    - name: Changed. Deleting instances
      alibaba.alicloud.ali_instance:
        instance_ids: '{{instances.ids}}'
        force: True
        state: absent

    - name: Changed. Deleting ram role
      alibaba.alicloud.ali_ram_role:
        role_name: '{{ ram_role.role.role_name }}'
        state: absent
      with_items: '{{ram_role}}'

    - name: Changed. Deleting security groups
      alibaba.alicloud.ali_security_group:
        name: '{{ item.group_name }}'
        vpc_id: '{{item.vpc_id}}'
        state: absent
      with_items: '{{sgs.groups}}'

    - name: Changed. Deleting vswitches
      alibaba.alicloud.ali_vswitch:
        vpc_id: '{{ item.vpc_id}}'
        cidr_block: '{{ item.cidr_block}}'
        state: absent
      with_items: '{{vswitches.vswitches}}'

    - name: Changed. Deleting vpcs
      alibaba.alicloud.ali_vpc:
        name: '{{item.vpc_name}}'
        cidr_block: '{{item.cidr_block}}'
        state: absent
      with_items: '{{vpcs.vpcs}}'
