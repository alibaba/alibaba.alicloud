---
- name: Validate module ali_instance
  hosts: localhost
  remote_user: root

  vars:
    test_kms_key_id: "{{ lookup('ansible.builtin.env', 'ALICLOUD_TEST_KMS_KEY_ID') }}"

  roles:
    - vpc
    - vswitch
    - security_group
    - ram
    - instance

  tasks:
    - name: Changed. Modifying name, host name and description when C(present)
      alibaba.alicloud.ali_instance:
        instance_ids: '{{ instances.ids}}'
        name: '{{ name }}-modified'
        description: 'Test modify name, host name and description'
        host_name: 'modify-host-name'

    - name: No Changed. Password and userdata will not be effect when C(present)
      alibaba.alicloud.ali_instance:
        instance_ids: '{{ instances.ids}}'
        password: 'NewTest12345'
        user_data: '#!/bin/bash -v \n cd /usr \n mkdir -p alicloud/ansible'

    - name: Changed. Modifying password when C(restarted)
      alibaba.alicloud.ali_instance:
        state: restarted
        instance_ids: '{{ instances.ids}}'
        password: 'NewTest12345'
        force: True

    - name: Changed. Modifying userdata when C(stopped)
      alibaba.alicloud.ali_instance:
        state: stopped
        instance_ids: '{{ instances.ids}}'
        user_data: '#!/bin/bash -v \n cd /usr \n mkdir -p alicloud/ansible'

    - name: Changed. Running the instance and modifying name, host name and description when C(running)
      alibaba.alicloud.ali_instance:
        state: running
        instance_ids: '{{ instances.ids}}'
        name: '{{ name }}'
        description: '{{instance_description}}'
        host_name: 'modify-host-name'

    - name: No Changed. There is no any attribute changed
      alibaba.alicloud.ali_instance:
        instance_ids: '{{ instances.ids}}'
        name: '{{ name }}'
        description: '{{instance_description}}'
        host_name: 'modify-host-name'
        password: 'Test12345'

    - name: Changed. Adding a tag
      alibaba.alicloud.ali_instance:
        instance_ids: '{{ instances.ids}}'
        tags:
          Test1: "add1"
          Test2: "add2"

    - name: Changed. Modifying a tag
      alibaba.alicloud.ali_instance:
        instance_ids: '{{ instances.ids}}'
        tags:
          Test1: "add1"
          Test2: "add3"

    - name: No Changed. No tags need to be added
      alibaba.alicloud.ali_instance:
        instance_ids: '{{ instances.ids}}'
        tags:
          Test1: "add1"
          Test2: "add3"

    - name: Changed. Removing other tags
      alibaba.alicloud.ali_instance:
        instance_ids: '{{instances.ids}}'
        purge_tags: True
        tags:
          Test1: "add1"
          Test2: "add2"

    - name: No Changed. No tags need to be removed
      alibaba.alicloud.ali_instance:
        instance_ids: '{{instances.ids}}'
        purge_tags: True
        tags:
          Test1: "add1"
          Test2: "add2"

    - name: Require the CMK test input
      ansible.builtin.assert:
        that:
          - test_kms_key_id | length > 0
        fail_msg: ALICLOUD_TEST_KMS_KEY_ID is required for the encryption test.

    - name: Create an instance with encrypted system and data disks
      alibaba.alicloud.ali_instance:
        image_id: '{{ image_id }}'
        instance_type: '{{ instance_type }}'
        instance_name: '{{ name }}-cmk'
        security_groups: ['{{ sgs.groups[0].id }}']
        vswitch_id: '{{ vswitches.vswitches[0].id }}'
        system_disk_category: cloud_essd
        system_disk_size: 40
        system_disk_encrypted: true
        system_disk_kms_key_id: '{{ test_kms_key_id }}'
        data_disks:
          - category: cloud_essd
            size: 40
            encrypted: true
            kms_key_id: '{{ test_kms_key_id }}'
      register: encrypted_instance

    - name: Read encrypted system and data disks
      alibaba.alicloud.ali_disk_info:
        filters:
          instance_id: '{{ encrypted_instance.instances[0].id }}'
      register: encrypted_disks

    - name: Verify both disks use the requested CMK
      ansible.builtin.assert:
        that:
          - encrypted_disks.total | int == 2
          - encrypted_disks.disks | selectattr('encrypted', 'equalto', true) | list | length == 2
          - encrypted_disks.disks | selectattr('kmskey_id', 'equalto', test_kms_key_id) | list | length == 2

#    - name: Changed. Modifying instance charge type
#      alibaba.alicloud.ali_instance:
#        instance_ids: '{{ instances.ids }}'
#        instance_charge_type: 'PrePaid'
#
#    - name: No Changed. Modifying instance charge type
#      alibaba.alicloud.ali_instance:
#        instance_ids: '{{ instances.ids }}'
#        instance_charge_type: 'PrePaid'
#
#    - name: Changed. Modifying instance charge type
#      alibaba.alicloud.ali_instance:
#        instance_ids: '{{ instances.ids }}'
#        instance_charge_type: 'PostPaid'
#
#    - name: No Changed. Modifying instance charge type
#      alibaba.alicloud.ali_instance:
#        instance_ids: '{{ instances.ids }}'
#        instance_charge_type: 'PostPaid'

    - name: Delete the encrypted CMK test instance
      alibaba.alicloud.ali_instance:
        instance_ids:
          - '{{ encrypted_instance.instances[0].id }}'
        force: True
        state: absent

    # Delete all of resource
    - name: Changed. Deleting instances
      alibaba.alicloud.ali_instance:
        instance_ids: '{{instances.ids}}'
        force: True
        state: absent

    - name: Changed. Deleting security groups
      alibaba.alicloud.ali_security_group:
        name: '{{ item.group_name }}'
        vpc_id: '{{item.vpc_id}}'
        state: absent
      with_items: '{{sgs.groups}}'

    - name: Changed. Deleting vswitches
      alibaba.alicloud.ali_vswitch:
        vpc_id: '{{ item.vpc_id}}'
        cidr_block: '{{ item.cidr_block}}'
        state: absent
      with_items: '{{vswitches.vswitches}}'

    - name: Changed. Deleting vpcs
      alibaba.alicloud.ali_vpc:
        name: '{{item.vpc_name}}'
        cidr_block: '{{item.cidr_block}}'
        state: absent
      with_items: '{{vpcs.vpcs}}'
