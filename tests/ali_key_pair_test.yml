---
- name: Validate module ali_key_pair
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: '{{ ansible_playbook_python }}'
    key_pair_name: ansible-aone-85044628-tags

  tasks:
    - name: Changed. Create a new key pair
      alibaba.alicloud.ali_key_pair:
        name: '{{ key_pair_name }}'
        # A test-only public key makes the create operation import a known key
        # and avoids emitting a generated private key in test output.
        public_key: >-
          ssh-rsa 
        tags:
          ManagedBy: Ansible
          TestCase: Aone-85044628

    - name: Changed. Update key pair tags without replacing the key pair
      alibaba.alicloud.ali_key_pair:
        name: '{{ key_pair_name }}'
        force: yes
        purge_tags: yes
        tags:
          ManagedBy: Ansible
          TestCase: Aone-85044628-updated

    - name: Query the key pair after the tag-only update
      alibaba.alicloud.ali_key_pair_info:
        name: '{{ key_pair_name }}'
      register: key_pairs

    - name: Verify the key pair was retained and tags were updated
      ansible.builtin.assert:
        that:
          - key_pairs.key_pairs | length == 1
          - key_pairs.key_pairs[0].name == key_pair_name
          - key_pairs.key_pairs[0].tags.ManagedBy == 'Ansible'
          - key_pairs.key_pairs[0].tags.TestCase == 'Aone-85044628-updated'

    - name: Changed. Remove key pair
      alibaba.alicloud.ali_key_pair:
        name: '{{ key_pair_name }}'
        state: absent
